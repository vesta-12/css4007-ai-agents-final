<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОТК.ai · Проверка кейсов</title><link rel="icon" href="/mark.svg?v=otk" type="image/svg+xml"><link rel="stylesheet" href="/inbox.css"><script defer src="/inbox.js"></script></head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
<symbol id="inbox" viewBox="0 0 24 24"><path d="M3 14l3-9h12l3 9v5H3z M3 14h5l2 3h4l2-3h5"/></symbol>
<symbol id="papers" viewBox="0 0 24 24"><path d="M7 3h10l3 3v13H7z M7 7H4v15h12 M10 10h7m-7 4h7"/></symbol>
<symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6m-6 4h6"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 5v14"/></symbol>
<symbol id="spread" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol>
<symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 5 10 7-10 7z"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<div class="shell">
<nav aria-label="Рабочее пространство">
<div class="brand"><img class="mark" src="/mark.svg?v=otk" alt=""><strong>ОТК<span class="brand-suffix">.ai</span></strong></div>
<div class="navtitle">Рабочее пространство</div>
<button id="checks" class="navitem" aria-pressed="true"><svg><use href="#inbox"/></svg>Проверки<span class="count">1</span></button>
<button id="files" class="navitem" aria-pressed="false"><svg><use href="#papers"/></svg>Материалы<span class="count" id="total">—</span></button>
<div class="profile"><span class="avatar">СС</span><div>София Сербина<small>Организатор</small></div></div>
</nav>
<aside class="queue"><header><h2 id="queue-title">Проверки</h2></header>
<label class="search"><svg><use href="#search"/></svg><input id="searchbox" type="search" placeholder="Поиск" aria-label="Поиск в списке"></label>
<div id="items"></div></aside>
<main>
<header class="top"><span id="crumb">Проверки</span><span class="slash">/</span><strong id="case-crumb">…</strong><button id="details-toggle" aria-controls="details" aria-expanded="true" title="Детали кейса" aria-label="Детали кейса"><svg><use href="#panel"/></svg></button></header>
<div class="scroll" id="thread" aria-live="polite"></div>
<footer id="actions"><div id="progress" role="status"></div><button id="run" class="primary" disabled><svg><use href="#play"/></svg><span>Запустить проверку</span></button></footer>
</main>
<aside id="details" class="details"><header><h2 id="context-title">Основания</h2><button id="close-details" title="Скрыть детали" aria-label="Скрыть детали"><svg><use href="#close"/></svg></button></header><div id="details-body"></div></aside>
</div></body></html>
